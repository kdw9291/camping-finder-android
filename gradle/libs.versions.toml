[versions]
agp = "9.3.1"
# AGP 9 는 Kotlin 을 내장한다. 최신 Kotlin(2.4.x)이 아니라 AGP 가 물고 있는 버전에 맞춰야 한다.
# 어긋나면 Compose 컴파일러 플러그인이 컴파일러 버전 불일치로 터진다.
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
lifecycle = "2.11.0"
navigation = "2.9.8"
retrofit = "3.0.0"
okhttp = "5.4.0"
serializationJson = "1.11.0"
# ⚠️ 최신은 3.5.0 이지만 쓸 수 없다.
#    3.5.0 은 kotlin-stdlib 2.4.0 을 끌어오는데, AGP 9.3.1 내장 Kotlin 컴파일러는 2.2.10 이라
#    메타데이터 2.4 를 읽지 못한다 ("can read versions up to 2.3.0").
#    버전별 stdlib 요구: 3.5.0→2.4.0 / 3.4.0→2.3.10 / 3.3.0→2.2.0
#    3.3.0 이 확실히 안전하다. KGP 를 올리면 그때 최신으로 간다.
coil = "3.3.0"

# 네이버 지도.
# stdlib 2.0.21 을 요구해 AGP 9 내장 컴파일러(2.2.10)와 충돌하지 않는다.
naverMapCompose = "1.9.0"

# ⚠️ map-sdk 를 명시적으로 올린다. 래퍼가 끌고 오는 3.21.0 으로는 지도가 안 그려진다.
#
#    3.21.0 은 서버가 내려주는 최신 스타일을 파싱하지 못한다:
#      W/NaverMap: [ParseStyle]: Unsupported layer type: mesh-batch
#      W/NaverMap: [ParseStyle]: invalid source type
#    스타일이 깨지면 그릴 레이어가 없어 배경이 격자만 남고, 오버레이(마커)만 보인다.
#    인증 실패와 증상이 비슷해서 헷갈리기 쉽다 — 인증은 로그에 401 이 찍힌다.
naverMapSdk = "3.23.3"

# 오프라인 캐시(M5).
#
# ⚠️ Room 3.0(androidx.room3:room3-runtime, 3.0.x)을 쓰지 않았다.
#    3.0 은 마룬 그룹이 통째로 바뀌었고(androidx.room → androidx.room3,
#    androidx.room.RoomDatabase → androidx.room3.RoomDatabase) KMP 를 겨냥한 재설계다.
#    이 앱은 안드로이드 전용이라 KMP 이점이 없고, 2026-03 에 나온 새 코드베이스라
#    stdlib 요구 버전이 AGP 9.3.1 내장 컴파일러(2.2.10, 메타데이터 2.3.0 까지)를
#    넘을 위험이 있다 — Coil 3.5.0 에서 이미 같은 방식으로 당했다.
#    2.8.4 는 Kotlin 2.0/2.1 시절 산출물이라 이 제약과 확실히 맞는다.
#    KGP 를 올릴 때 room3 로 옮긴다. 패키지명이 바뀌었으므로 이전은 치환 작업이다.
room = "2.8.4"

junit = "4.13.2"

# DAO 테스트.
#
# Room 은 실제 SQLite 위에서만 의미 있게 검증된다. JVM 단위 테스트로는 쿼리가 검증되지 않는다 —
# ORDER BY 누락이나 NOT IN 서브쿼리의 동작은 SQLite 가 실제로 돌아야 드러난다.
# 그래서 인스트루먼테이션 테스트(androidTest)로 간다.
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
# 코루틴 본체가 1.10.2 로 해석된다(lifecycle 이 끌고 온다). test 아티팩트는 본체와 같은 버전이어야
# runTest 의 스케줄러가 어긋나지 않는다.
coroutinesTest = "1.10.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose 는 BOM 이 버전을 맞춘다. 개별 아티팩트에 버전을 적지 않는다.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

# 이미지 로딩. 썸네일은 gocamping.or.kr 의 외부 URL 이라 캐시가 필요하다.
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

naver-map-compose = { group = "io.github.fornewid", name = "naver-map-compose", version.ref = "naverMapCompose" }
naver-map-sdk = { group = "com.naver.maps", name = "map-sdk", version.ref = "naverMapSdk" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
# MigrationTestHelper 를 쓰지는 않지만, Room 이 테스트에서 쓰는 런타임 조각이 여기 들어 있다.
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# org.jetbrains.kotlin.android 은 적용하지 않는다 — AGP 9.0 부터 내장되어 충돌한다.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
